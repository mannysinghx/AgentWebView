[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwebview"
version = "0.1.0"
description = "Give every AI agent a budget, a set of rules and a receipt: web search through your own provider keys, free credit first."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "AgentWebView contributors" }]
keywords = ["mcp", "ai-agents", "web-search", "budget", "exa", "tavily", "firecrawl", "serpapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "mcp>=2.3,<3",
  "trafilatura>=2.0",
  "lxml>=5.3",
  "cryptography>=43",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8", "tavily-python>=0.8.5"]

[project.scripts]
agentwebview = "agentwebview.cli:main"

[project.urls]
Homepage = "https://github.com/mannysinghx/AgentWebView"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentwebview = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: needs Playwright and a local Chromium"]
